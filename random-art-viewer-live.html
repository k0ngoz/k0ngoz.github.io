<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Random Art Viewer — Live</title>
<style>
  :root{
    --bg:#121113;
    --ink:#F3EEE7;
    --muted:#9A9490;
    --brass:#C9A66B;
    --brass-dim:rgba(201,166,107,.35);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;
    background:var(--bg);
    overflow:hidden;
    overscroll-behavior:none;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:var(--ink);
    height:100vh;
  }
  #feed{
    position:fixed;
    inset:0;
    overflow-y:scroll;
    overflow-x:hidden;
    scroll-snap-type:y mandatory;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior-y:contain;
    height:100vh;
    height:100dvh;
  }
  .slide{
    position:relative;
    height:100vh;
    height:100dvh;
    width:100vw;
    scroll-snap-align:start;
    scroll-snap-stop:always;
    overflow:hidden;
    background:var(--bg);
  }
  .stage{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    touch-action:pan-y;
  }
  .zoom-wrap{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    transform-origin:50% 50%;
    will-change:transform;
    background-size:cover;
    background-position:center;
  }
  .zoom-wrap img{
    max-width:92%;
    max-height:78%;
    object-fit:contain;
    pointer-events:none;
    -webkit-user-drag:none;
    user-select:none;
    opacity:0;
    transition:opacity .5s ease;
    filter:drop-shadow(0 24px 48px rgba(0,0,0,.55));
  }
  .zoom-wrap img.loaded{opacity:1;}

  .loader{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    pointer-events:none;
    transition:opacity .4s ease;
  }
  .loader.hidden{opacity:0;}
  .loader-dot{
    width:6px;height:6px;border-radius:50%;
    background:var(--brass);
    animation:pulse 1.1s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{transform:scale(1);opacity:.35;}
    50%{transform:scale(1.8);opacity:1;}
  }

  .placard{
    position:absolute;
    left:0;right:0;bottom:0;
    padding:0 22px 28px 22px;
    padding-top:64px;
    background:linear-gradient(to top, rgba(10,9,10,.86) 0%, rgba(10,9,10,.5) 45%, rgba(10,9,10,0) 100%);
    pointer-events:none;
    transform:translateY(6px);
    opacity:0;
    transition:opacity .6s ease .1s, transform .6s ease .1s;
  }
  .slide.ready .placard{opacity:1;transform:translateY(0);}
  .placard .hairline{
    width:36px;height:1px;
    background:var(--brass);
    margin-bottom:12px;
  }
  .placard .title{
    font-style:italic;
    font-size:19px;
    line-height:1.3;
    max-width:90%;
  }
  .placard .meta{
    margin-top:6px;
    font-size:11px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--muted);
  }

  .counter{
    position:absolute;
    top:18px;
    right:20px;
    font-size:11px;
    color:var(--ink);
    opacity:.4;
    font-variant-numeric:tabular-nums;
    pointer-events:none;
  }
  .badge{
    position:absolute;
    top:18px;
    left:20px;
    font-size:10px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--brass);
    opacity:.75;
    pointer-events:none;
  }

  .hint{
    position:fixed;
    left:50%;bottom:28px;
    transform:translateX(-50%);
    padding:9px 16px;
    border-radius:100px;
    background:rgba(18,17,19,.7);
    border:1px solid var(--brass-dim);
    font-size:12px;
    color:var(--ink);
    z-index:20;
    opacity:1;
    transition:opacity .5s ease;
    pointer-events:none;
  }
  .hint.gone{opacity:0;}

  .errorbox{
    position:fixed;inset:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:10px;padding:0 32px;text-align:center;
    background:var(--bg);z-index:50;
  }
  .errorbox .t{font-style:italic;font-size:17px;color:var(--ink);}
  .errorbox .s{font-size:12px;color:var(--muted);}
</style>
</head>
<body>

<div id="feed"></div>
<div class="hint" id="hint">Pinch or double‑tap to zoom &middot; Swipe up for more</div>

<script>
(function(){
  try{

    // =====================================================================
    // PROVIDER LAYER — each provider exposes an async getRandom() that
    // resolves to { imageUrl, title, artist, date, source } or throws.
    // To add a new API: implement the same shape and push it into PROVIDERS.
    // =====================================================================

    function shuffle(arr){
      for(var i=arr.length-1;i>0;i--){
        var j = Math.floor(Math.random()*(i+1));
        var t = arr[i]; arr[i]=arr[j]; arr[j]=t;
      }
      return arr;
    }

    // ---------- The Met (collectionapi.metmuseum.org) ----------
    var met = (function(){
      var idsCache = null;
      var seen = new Set();
      async function init(){
        if(idsCache) return;
        var res = await fetch('https://collectionapi.metmuseum.org/public/collection/v1/objects');
        var data = await res.json();
        idsCache = (data && data.objectIDs) || [];
      }
      // Met's search API has no clean "classification" filter param, so we
      // sample uniformly from the full ID space (as before) and reject
      // anything that isn't classified as a Painting or Drawing client-side.
      // This costs extra retries but keeps the sampling mathematically
      // uniform within the painting+drawing subset — no keyword-search bias.
      function isPaintingOrDrawing(obj){
        var cls = ((obj && obj.classification) || '').toLowerCase();
        return cls.indexOf('painting') > -1 || cls.indexOf('drawing') > -1;
      }
      async function getRandom(){
        await init();
        if(!idsCache.length) throw new Error('met: empty id list');
        for(var attempt=0; attempt<20; attempt++){
          var idx = Math.floor(Math.random()*idsCache.length);
          var id = idsCache[idx];
          if(seen.has(id)) continue;
          var res = await fetch('https://collectionapi.metmuseum.org/public/collection/v1/objects/'+id);
          if(!res.ok) continue;
          var obj = await res.json();
          var img = obj.primaryImageSmall || obj.primaryImage;
          if(!img) continue;
          if(!isPaintingOrDrawing(obj)) continue;
          seen.add(id);
          return {
            imageUrl: img,
            title: obj.title || 'Untitled',
            artist: obj.artistDisplayName || 'Unknown artist',
            date: obj.objectDate || '',
            source: 'The Met'
          };
        }
        throw new Error('met: exhausted attempts');
      }
      return { name:'met', getRandom: getRandom };
    })();

    // ---------- Art Institute of Chicago (api.artic.edu) ----------
    var aic = (function(){
      var total = null;
      var seenPages = new Set();

      // AIC's search is Elasticsearch-backed and supports a bracket-notation
      // query DSL over GET. This asks for public-domain works whose
      // classification_titles includes "painting" OR "drawing and
      // watercolor" — a single query, so pagination.total already reflects
      // the correct combined size (no manual weighting needed).
      function searchUrl(page, limit, fields){
        var p = new URLSearchParams();
        p.set('query[bool][must][0][term][is_public_domain]', 'true');
        p.set('query[bool][must][1][terms][classification_titles][0]', 'painting');
        p.set('query[bool][must][1][terms][classification_titles][1]', 'drawing and watercolor');
        p.set('limit', String(limit));
        if(page) p.set('page', String(page));
        if(fields) p.set('fields', fields);
        return 'https://api.artic.edu/api/v1/artworks/search?' + p.toString();
      }

      async function init(){
        if(total) return;
        var res = await fetch(searchUrl(1, 1, 'id'));
        var data = await res.json();
        var t = (data.pagination && data.pagination.total) || 5000;
        total = Math.min(t, 10000); // AIC caps pagination at 10k
      }
      async function getRandom(){
        await init();
        for(var attempt=0; attempt<6; attempt++){
          var page = 1 + Math.floor(Math.random()*total);
          if(seenPages.has(page)) continue;
          var url = searchUrl(page, 1, 'id,title,artist_display,image_id,date_display');
          var res = await fetch(url);
          if(!res.ok) continue;
          var data = await res.json();
          var item = data.data && data.data[0];
          if(!item || !item.image_id) continue;
          var iiif = (data.config && data.config.iiif_url) || 'https://www.artic.edu/iiif/2';
          seenPages.add(page);
          return {
            imageUrl: iiif + '/' + item.image_id + '/full/843,/0/default.jpg',
            title: item.title || 'Untitled',
            artist: (item.artist_display || 'Unknown artist').split('\n')[0],
            date: item.date_display || '',
            source: 'Art Institute of Chicago'
          };
        }
        throw new Error('aic: exhausted attempts');
      }
      return { name:'aic', getRandom: getRandom };
    })();

    // ---------- Cleveland Museum of Art (openaccess-api.clevelandart.org) ----------
    var cma = (function(){
      // CMA's "type" filter takes one value at a time, so Painting and
      // Drawing are queried as two separate buckets with their own totals.
      // Each getRandom() call picks a bucket weighted by its share of the
      // combined total — e.g. if there are 4x more paintings than drawings
      // in the collection, painting is picked ~4x as often — so the result
      // is equivalent to uniform sampling over the *union* of both types,
      // not a flat 50/50 that would over-represent the smaller bucket.
      var TYPES = ['Painting', 'Drawing'];
      var totals = { Painting: null, Drawing: null };
      var seenSkips = { Painting: new Set(), Drawing: new Set() };

      function baseUrl(type, skip){
        var url = 'https://openaccess-api.clevelandart.org/api/artworks/?limit=1&cc0=1&has_image=1&type=' + encodeURIComponent(type);
        if(skip !== undefined) url += '&skip=' + skip;
        return url;
      }

      async function fetchTotal(type){
        try{
          var res = await fetch(baseUrl(type));
          if(!res.ok) return 0;
          var data = await res.json();
          return (data.info && data.info.total) || 0;
        } catch(e){ return 0; }
      }

      async function init(){
        if(totals.Painting !== null && totals.Drawing !== null) return;
        var results = await Promise.all(TYPES.map(fetchTotal));
        totals.Painting = results[0];
        totals.Drawing = results[1];
      }

      function pickType(){
        var combined = totals.Painting + totals.Drawing;
        if(combined <= 0) return TYPES[Math.floor(Math.random()*TYPES.length)];
        return (Math.random() * combined < totals.Painting) ? 'Painting' : 'Drawing';
      }

      async function getRandom(){
        await init();
        if((totals.Painting||0) + (totals.Drawing||0) <= 0) throw new Error('cma: no matching totals');
        for(var attempt=0; attempt<10; attempt++){
          var type = pickType();
          var total = totals[type];
          if(!total) continue;
          var skip = Math.floor(Math.random()*total);
          if(seenSkips[type].has(skip)) continue;
          var res = await fetch(baseUrl(type, skip));
          if(!res.ok) continue;
          var data = await res.json();
          var item = data.data && data.data[0];
          var imgUrl = item && item.images && item.images.web && item.images.web.url;
          if(!item || !imgUrl) continue;
          seenSkips[type].add(skip);
          var artist = (item.creators && item.creators[0] && item.creators[0].description) || 'Unknown artist';
          return {
            imageUrl: imgUrl,
            title: item.title || 'Untitled',
            artist: artist,
            date: item.creation_date || '',
            source: 'Cleveland Museum of Art'
          };
        }
        throw new Error('cma: exhausted attempts');
      }
      return { name:'cma', getRandom: getRandom };
    })();

    var PROVIDERS = [met, aic, cma];

    async function fetchRandomArtwork(){
      var order = shuffle(PROVIDERS.slice());
      for(var i=0;i<order.length;i++){
        try{
          var art = await order[i].getRandom();
          if(art) return art;
        } catch(e){ /* fall through to next provider */ }
      }
      return null; // all providers unreachable — caller falls back to generative art
    }

    // =====================================================================
    // OFFLINE FALLBACK — generative canvas art, used only if every
    // provider above is unreachable (e.g. blocked network sandbox).
    // =====================================================================

    var PALETTES = [
      { name:'Ember',    bg:[17,15,20],  colors:[[255,111,97],[255,165,73],[255,205,86],[159,110,194]] },
      { name:'Abyssal',  bg:[7,18,26],   colors:[[26,111,133],[6,177,184],[136,222,203],[233,196,106]] },
      { name:'Verdant',  bg:[12,19,14],  colors:[[74,124,89],[168,197,109],[230,197,110],[178,92,68]] },
      { name:'Jewel',    bg:[10,8,16],   colors:[[214,40,141],[64,196,217],[255,196,61],[110,84,196]] },
      { name:'Terra',    bg:[24,17,13],  colors:[[201,166,107],[181,101,29],[224,201,163],[122,74,45]] },
      { name:'Nocturne', bg:[13,12,24],  colors:[[123,140,214],[186,156,214],[130,201,182],[220,220,235]] }
    ];
    function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
    function rgbStr(c){ return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')'; }
    function rgbaStr(c,a){ return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }

    function styleFlowField(ctx,w,h,palette){
      ctx.fillStyle = rgbStr(palette.bg); ctx.fillRect(0,0,w,h);
      var terms = [];
      for(var i=0;i<4;i++){
        terms.push({ fx:(Math.random()*2-1)*0.008, fy:(Math.random()*2-1)*0.008, amp:0.4+Math.random()*0.6, phase:Math.random()*Math.PI*2 });
      }
      function angleAt(x,y){
        var sum=0;
        for(var i=0;i<terms.length;i++){ var t=terms[i]; sum += t.amp*Math.sin(x*t.fx+y*t.fy+t.phase); }
        return sum*Math.PI;
      }
      var lines = 200+Math.floor(Math.random()*100);
      for(var i=0;i<lines;i++){
        var x=Math.random()*w, y=Math.random()*h;
        var color = pick(palette.colors);
        ctx.strokeStyle = rgbaStr(color, 0.25+Math.random()*0.4);
        ctx.lineWidth = 1+Math.random()*2.2;
        ctx.beginPath(); ctx.moveTo(x,y);
        var steps = 50+Math.floor(Math.random()*70);
        for(var s=0;s<steps;s++){
          var a = angleAt(x,y);
          x += Math.cos(a)*5; y += Math.sin(a)*5;
          ctx.lineTo(x,y);
          if(x<-20||x>w+20||y<-20||y>h+20) break;
        }
        ctx.stroke();
      }
    }
    function styleRadialBloom(ctx,w,h,palette){
      ctx.fillStyle = rgbStr(palette.bg); ctx.fillRect(0,0,w,h);
      var n = 36+Math.floor(Math.random()*28);
      for(var i=0;i<n;i++){
        var cx=Math.random()*w, cy=Math.random()*h;
        var r = 40+Math.random()*Math.min(w,h)*0.4;
        var color = pick(palette.colors);
        var grad = ctx.createRadialGradient(cx,cy,0,cx,cy,r);
        grad.addColorStop(0, rgbaStr(color,0.55));
        grad.addColorStop(1, rgbaStr(color,0));
        ctx.fillStyle = grad;
        ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
      }
    }
    function styleGeometricGrid(ctx,w,h,palette){
      ctx.fillStyle = rgbStr(palette.bg); ctx.fillRect(0,0,w,h);
      var cols = 6+Math.floor(Math.random()*5);
      var cw = w/cols;
      var rows = Math.ceil(h/cw);
      var ch = h/rows;
      for(var r=0;r<rows;r++){
        for(var c=0;c<cols;c++){
          if(Math.random()<0.6){
            var color = pick(palette.colors);
            ctx.fillStyle = rgbaStr(color, 0.45+Math.random()*0.5);
            var x=c*cw, y=r*ch;
            ctx.beginPath();
            if(Math.random()<0.5){ ctx.moveTo(x,y); ctx.lineTo(x+cw,y); ctx.lineTo(x,y+ch); }
            else { ctx.moveTo(x+cw,y); ctx.lineTo(x+cw,y+ch); ctx.lineTo(x,y+ch); }
            ctx.closePath(); ctx.fill();
          }
        }
      }
    }
    function styleOrbitalTrails(ctx,w,h,palette){
      ctx.fillStyle = rgbStr(palette.bg); ctx.fillRect(0,0,w,h);
      var centers = 4+Math.floor(Math.random()*4);
      for(var i=0;i<centers;i++){
        var cx=w*0.2+Math.random()*w*0.6, cy=h*0.2+Math.random()*h*0.6;
        var rings = 10+Math.floor(Math.random()*14);
        var baseRot = Math.random()*Math.PI*2;
        var color = pick(palette.colors);
        for(var j=0;j<rings;j++){
          var rx = 20+j*(Math.min(w,h)*0.022);
          var ry = rx*(0.35+Math.random()*0.5);
          ctx.save(); ctx.translate(cx,cy); ctx.rotate(baseRot+j*0.18);
          ctx.strokeStyle = rgbaStr(color, 0.15+Math.random()*0.35);
          ctx.lineWidth = 1+Math.random()*1.5;
          ctx.beginPath(); ctx.ellipse(0,0,rx,ry,0,0,Math.PI*2); ctx.stroke();
          ctx.restore();
        }
      }
    }
    var STYLES = [
      { name:'Flow Field', fn:styleFlowField },
      { name:'Radial Bloom', fn:styleRadialBloom },
      { name:'Geometric Grid', fn:styleGeometricGrid },
      { name:'Orbital Trails', fn:styleOrbitalTrails }
    ];

    function clamp(v,min,max){ return Math.max(min,Math.min(max,v)); }
    function targetSize(){
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      var w = clamp(Math.round((window.innerWidth||400)*dpr), 500, 1500);
      var h = clamp(Math.round((window.innerHeight||700)*dpr), 700, 2200);
      return {w:w,h:h};
    }
    function generateFallbackArt(){
      var style = pick(STYLES);
      var palette = pick(PALETTES);
      var size = targetSize();
      var canvas = document.createElement('canvas');
      canvas.width = size.w; canvas.height = size.h;
      var ctx = canvas.getContext('2d');
      if(!ctx) throw new Error('no-2d-context');
      style.fn(ctx, size.w, size.h, palette);
      return {
        imageUrl: canvas.toDataURL('image/jpeg', 0.9),
        title: style.name + ' Study',
        artist: palette.name + ' palette',
        date: '',
        source: 'Generative (offline)'
      };
    }

    // =====================================================================
    // FEED UI — unchanged pinch/zoom/scroll mechanics, now populated
    // asynchronously per-slide.
    // =====================================================================

    var feedEl = document.getElementById('feed');
    var hintEl = document.getElementById('hint');
    var count = 0;

    function escapeHtml(s){
      return String(s).replace(/[&<>"']/g, function(c){
        return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
      });
    }

    function makeSlide(){
      count++;
      var n = count;
      var slide = document.createElement('div');
      slide.className = 'slide';

      var stage = document.createElement('div');
      stage.className = 'stage';
      var wrap = document.createElement('div');
      wrap.className = 'zoom-wrap';
      var img = document.createElement('img');
      img.draggable = false;
      var loader = document.createElement('div');
      loader.className = 'loader';
      loader.innerHTML = '<div class="loader-dot"></div>';

      stage.appendChild(wrap);
      stage.appendChild(loader);
      slide.appendChild(stage);

      var badge = document.createElement('div');
      badge.className = 'badge';
      badge.textContent = 'Loading…';
      slide.appendChild(badge);

      var placard = document.createElement('div');
      placard.className = 'placard';
      slide.appendChild(placard);

      var counter = document.createElement('div');
      counter.className = 'counter';
      counter.textContent = String(n).padStart(2,'0');
      slide.appendChild(counter);

      function finish(){ loader.classList.add('hidden'); slide.classList.add('ready'); }

      function renderArt(art, isLive){
        img.alt = art.title;
        img.onload = function(){ img.classList.add('loaded'); finish(); };
        img.onerror = function(){ renderArt(generateFallbackArt(), false); };
        img.src = art.imageUrl;
        if(!img.parentNode) wrap.appendChild(img);
        badge.textContent = isLive ? art.source : 'Offline';
        placard.innerHTML = '<div class="hairline"></div>' +
          '<div class="title">' + escapeHtml(art.title) + '</div>' +
          '<div class="meta">' + escapeHtml(art.artist) + (art.date ? ' &middot; ' + escapeHtml(art.date) : '') +
          ' &middot; ' + escapeHtml(art.source) + '</div>';
      }

      (async function(){
        var art = null;
        try{ art = await fetchRandomArtwork(); } catch(e){ art = null; }
        if(art){
          renderArt(art, true);
        } else {
          try{ renderArt(generateFallbackArt(), false); }
          catch(e){
            wrap.style.background = 'linear-gradient(160deg,#2a2730,#121113)';
            finish();
            badge.textContent = 'Offline';
          }
        }
      })();

      attachZoom(stage, wrap, slide);
      return slide;
    }

    function attachZoom(stage, wrap, slide){
      var state = { scale:1, tx:0, ty:0, pointers:new Map(), pinchStartDist:0, pinchStartScale:1,
                    pinchStartMid:{x:0,y:0}, pinchStartTranslate:{x:0,y:0}, lastPanPoint:null,
                    tapStart:null, lastTapTime:0, lastTapX:0, lastTapY:0 };

      function apply(animate){
        wrap.style.transition = animate ? 'transform .28s cubic-bezier(.2,.8,.2,1)' : 'none';
        wrap.style.transform = 'translate3d(' + state.tx + 'px,' + state.ty + 'px,0) scale(' + state.scale + ')';
        slide.classList.toggle('zoomed', state.scale > 1.02);
      }
      function maxOffset(){
        var r = stage.getBoundingClientRect();
        return { x: Math.max(0,(state.scale-1))*r.width*0.5, y: Math.max(0,(state.scale-1))*r.height*0.5 };
      }
      function toggleZoomAt(point){
        if(state.scale > 1.02){
          state.scale=1; state.tx=0; state.ty=0;
          wrap.style.transformOrigin = '50% 50%';
        } else {
          var rect = wrap.getBoundingClientRect();
          var ox = clamp(((point.x-rect.left)/rect.width)*100, 15, 85);
          var oy = clamp(((point.y-rect.top)/rect.height)*100, 15, 85);
          wrap.style.transformOrigin = ox+'% '+oy+'%';
          state.scale=2.4; state.tx=0; state.ty=0;
        }
        apply(true);
      }
      function resetIfZoomed(){
        if(state.scale > 1.001){
          state.scale=1; state.tx=0; state.ty=0;
          wrap.style.transformOrigin = '50% 50%';
          apply(false);
        }
      }
      stage._resetZoom = resetIfZoomed;

      stage.addEventListener('pointerdown', function(e){
        state.pointers.set(e.pointerId, {x:e.clientX,y:e.clientY});
        if(state.pointers.size === 1){
          state.tapStart = {time:Date.now(), x:e.clientX, y:e.clientY};
          state.lastPanPoint = {x:e.clientX, y:e.clientY};
        } else if(state.pointers.size === 2){
          state.tapStart = null;
          var pts = Array.from(state.pointers.values());
          state.pinchStartDist = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y) || 1;
          state.pinchStartScale = state.scale;
          state.pinchStartMid = {x:(pts[0].x+pts[1].x)/2, y:(pts[0].y+pts[1].y)/2};
          state.pinchStartTranslate = {x:state.tx, y:state.ty};
        }
      });
      stage.addEventListener('pointermove', function(e){
        if(!state.pointers.has(e.pointerId)) return;
        state.pointers.set(e.pointerId, {x:e.clientX,y:e.clientY});
        if(state.pointers.size === 2){
          e.preventDefault();
          var pts = Array.from(state.pointers.values());
          var dist = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y) || 1;
          var mid = {x:(pts[0].x+pts[1].x)/2, y:(pts[0].y+pts[1].y)/2};
          var newScale = clamp(state.pinchStartScale*(dist/state.pinchStartDist), 1, 4);
          state.scale = newScale;
          state.tx = state.pinchStartTranslate.x + (mid.x - state.pinchStartMid.x);
          state.ty = state.pinchStartTranslate.y + (mid.y - state.pinchStartMid.y);
          var m = maxOffset();
          state.tx = clamp(state.tx, -m.x-40, m.x+40);
          state.ty = clamp(state.ty, -m.y-40, m.y+40);
          apply(false);
        } else if(state.pointers.size === 1 && state.scale > 1.02){
          e.preventDefault();
          var p = state.pointers.get(e.pointerId);
          var last = state.lastPanPoint || p;
          var dx = p.x-last.x, dy = p.y-last.y;
          var m2 = maxOffset();
          state.tx = clamp(state.tx+dx, -m2.x-40, m2.x+40);
          state.ty = clamp(state.ty+dy, -m2.y-40, m2.y+40);
          state.lastPanPoint = p;
          apply(false);
        } else if(state.pointers.size === 1){
          state.lastPanPoint = state.pointers.get(e.pointerId);
        }
      }, {passive:false});
      function endPointer(e){
        var wasSingle = state.pointers.size === 1;
        var p = state.pointers.get(e.pointerId) || state.lastPanPoint || {x:0,y:0};
        state.pointers.delete(e.pointerId);
        if(wasSingle && state.tapStart){
          var dt = Date.now()-state.tapStart.time;
          var dist = Math.hypot(p.x-state.tapStart.x, p.y-state.tapStart.y);
          if(dt<400 && dist<12){
            var sinceLast = Date.now()-state.lastTapTime;
            var tapDist = Math.hypot(p.x-state.lastTapX, p.y-state.lastTapY);
            if(sinceLast<320 && tapDist<40){ toggleZoomAt(p); state.lastTapTime=0; }
            else { state.lastTapTime=Date.now(); state.lastTapX=p.x; state.lastTapY=p.y; }
          }
        }
        state.tapStart = null;
        if(state.pointers.size<2) state.pinchStartDist = 0;
        if(state.pointers.size===1) state.lastPanPoint = Array.from(state.pointers.values())[0];
        if(state.pointers.size===0 && state.scale<1.04 && state.scale!==1){
          state.scale=1; state.tx=0; state.ty=0;
          wrap.style.transformOrigin='50% 50%';
          apply(true);
        }
      }
      stage.addEventListener('pointerup', endPointer);
      stage.addEventListener('pointercancel', endPointer);
      stage.addEventListener('dblclick', function(e){ toggleZoomAt({x:e.clientX,y:e.clientY}); });
    }

    var io = null;
    if(typeof IntersectionObserver !== 'undefined'){
      io = new IntersectionObserver(function(entries){
        for(var i=0;i<entries.length;i++){
          var entry = entries[i];
          if(entry.intersectionRatio < 0.6){
            var stage = entry.target.querySelector('.stage');
            if(stage && stage._resetZoom) stage._resetZoom();
          }
        }
      }, {threshold:[0,0.6,1]});
    }

    function appendSlides(n){
      for(var i=0;i<n;i++){
        var slide = makeSlide();
        feedEl.appendChild(slide);
        if(io) io.observe(slide);
      }
    }

    var scrollTicking = false;
    feedEl.addEventListener('scroll', function(){
      if(!hintEl.classList.contains('gone')) hintEl.classList.add('gone');
      if(scrollTicking) return;
      scrollTicking = true;
      requestAnimationFrame(function(){
        var nearBottom = feedEl.scrollTop + feedEl.clientHeight > feedEl.scrollHeight - window.innerHeight*1.5;
        if(nearBottom) appendSlides(2);
        scrollTicking = false;
      });
    }, {passive:true});

    feedEl.addEventListener('pointerdown', function(){ hintEl.classList.add('gone'); }, {once:true});
    document.addEventListener('gesturestart', function(e){ e.preventDefault(); });
    document.addEventListener('gesturechange', function(e){ e.preventDefault(); });
    setTimeout(function(){ hintEl.classList.add('gone'); }, 4500);

    appendSlides(4);
  } catch(err){
    document.body.innerHTML = '<div class="errorbox"><div class="t">Something broke</div><div class="s">' +
      (err && err.message ? err.message : 'Unknown error') + '</div></div>';
  }
})();
</script>

</body>
</html>
